    access: manual   # registration required
    robots_checked: null

  - key: fannie_sflp
    name: Fannie Mae Single-Family Loan Performance
    url: https://www.fanniemae.com/loanperformance
    layer: distress
    access: manual   # registration required; 3-digit ZIP grain
    robots_checked: null

