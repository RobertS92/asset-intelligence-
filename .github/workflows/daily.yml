name: daily-exodus

on:
  schedule:
    # 06:15 America/Chicago ≈ 11:15 UTC (CDT) / 12:15 UTC (CST)
    - cron: "15 11 * * *"
    - cron: "15 12 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-extras

      - name: Firewall
        run: uv run python scripts/verify_firewall.py

      - name: Fetch Phase-1 sources
        env:
          EXODUS_CONTACT_EMAIL: ${{ secrets.EXODUS_CONTACT_EMAIL }}
          EXODUS_SLACK_WEBHOOK_URL: ${{ secrets.EXODUS_SLACK_WEBHOOK_URL }}
          EXODUS_SMTP_HOST: ${{ secrets.EXODUS_SMTP_HOST }}
          EXODUS_SMTP_PORT: ${{ secrets.EXODUS_SMTP_PORT }}
          EXODUS_SMTP_USER: ${{ secrets.EXODUS_SMTP_USER }}
          EXODUS_SMTP_PASSWORD: ${{ secrets.EXODUS_SMTP_PASSWORD }}
          EXODUS_DIGEST_TO: ${{ secrets.EXODUS_DIGEST_TO }}
        run: |
          set -euo pipefail
          for key in tarrant_constable3_taxsale houston_pd_vehicle_auction harris_so_vehicle_auction harris_taxsale collin_taxsale; do
            uv run python -m exodus.cli fetch "$key" || echo "fetch_failed:$key" >> /tmp/exodus_failures.txt
          done
          uv run python -m exodus.cli normalize
          uv run python -m exodus.cli digest

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detail = 'daily pipeline failed';
            if (fs.existsSync('/tmp/exodus_failures.txt')) {
              detail += '\n\n' + fs.readFileSync('/tmp/exodus_failures.txt', 'utf8');
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `daily pipeline failed ${new Date().toISOString().slice(0,10)}`,
              body: detail,
              labels: ['needs-rob', 'pipeline']
            });

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: make check
