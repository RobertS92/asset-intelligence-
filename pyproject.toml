[project]
name = "exodus"
version = "0.1.0"
description = "Exodus Asset Signals — Risk Map and Auction Finder for Texas distressed assets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.0",
    "shap>=0.45",
    "scikit-learn>=1.5",
    "geopandas>=1.0",
    "h3>=3.7",
    "streamlit>=1.38",
    "python-dateutil>=2.9",
    "tenacity>=8.0",
    "protego>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-python-dateutil>=2.9",
]

[project.scripts]
exodus = "exodus.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM102", "SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["exodus.common", "exodus.scoring"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "shap.*",
    "pdfplumber.*",
    "protego.*",
    "h3.*",
    "geopandas.*",
    "duckdb.*",
    "sklearn.*",
    "sklearn.metrics.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "playwright>=1.64.0",
    "types-requests>=2.33.0.20261006",
]
